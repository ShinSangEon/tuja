name: collect
# 선택 사항. collect 만 자동 실행해 out/pending.md 를 artifact 로 올린다. 추출·ingest 는 Claude 세션에서.
on:
  schedule:
    - cron: "30 22 * * *"   # 07:30 KST
  workflow_dispatch:
    inputs:
      since:
        description: "YYYY-MM-DD (기본: 3일 전)"
        required: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r collector/requirements.txt
      - run: |
          cd collector
          if [ -n "${{ github.event.inputs.since }}" ]; then python run.py collect --since "${{ github.event.inputs.since }}"; else python run.py collect; fi
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: pending-${{ github.run_id }}
          path: collector/out/pending.md
